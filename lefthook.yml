# Git hooks, installed by `pnpm install` (the "prepare" script runs `lefthook install`).
# Skip once in an emergency with LEFTHOOK=0 git commit ... (CI checks the same rules anyway).
pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: "*.{js,mjs,cjs,ts,tsx}"
      exclude:
        - "docs/**"
        - "supabase/**"
        - "src/lib/supabase/database.types.ts"
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true
    - name: prettier
      glob: "*.{js,mjs,cjs,ts,tsx,json,css,html,md,yml,yaml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: branch name
      run: node scripts/branch-name.mjs
