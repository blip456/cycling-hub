name: Set up Node and pnpm
description: Installs pnpm (version from package.json), Node (version from .nvmrc) and the dependencies, with the pnpm store cached.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
