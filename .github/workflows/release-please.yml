# Keeps a release PR ("chore(release): release X.Y.Z") open against main (decision D5). Merging it
# bumps package.json, updates CHANGELOG.md, tags vX.Y.Z and publishes a GitHub Release; Vercel then
# deploys that commit to production (scripts/vercel-ignore-build.sh) and back-merge.yml brings the
# bump back to dev.
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Optional fine-grained PAT (contents + pull requests: write). With the default token,
          # GitHub does not start CI on the release PR; see docs/setup-production.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summary
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: echo "Released $TAG" >> "$GITHUB_STEP_SUMMARY"
