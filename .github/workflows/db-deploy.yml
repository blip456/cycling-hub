# Applies new migrations to the hosted database (decisions T2, T3, D10): a push to dev applies them to the
# Supabase project of the GitHub environment "dev" (today cycling-hub-dev, which is also production). A
# separate production database (cycling-hub-prod) will get its own environment and a main trigger later.
# The environment holds SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_REF.
name: Database deploy

on:
  push:
    branches: [dev]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy migrations (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    # Never run two deploys against the same database at once, and never cancel one halfway.
    concurrency:
      group: db-deploy-dev
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3

      - name: Check the environment secrets
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the 'dev' environment:$missing (see docs/setup-production.md)."
            exit 1
          fi

      - name: Link the Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show pending migrations
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push --yes
